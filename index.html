<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOX MKT</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #111;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
  overflow: hidden;
}

.splash {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  width: 100%;
  padding: 2rem;
  transition: opacity 0.5s ease;
}

.logo-wrap {
  margin-bottom: 2rem;
  animation: fadeUp 0.8s ease both;
}

.logo-box {
  width: 80px;
  height: 80px;
  background: #c8ff00;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1rem;
  animation: pulse 2s ease infinite;
}

.logo-box svg {
  width: 44px;
  height: 44px;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(200,255,0,0.3); }
  50% { box-shadow: 0 0 0 16px rgba(200,255,0,0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.logo-nome {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 28px;
  color: #c8ff00;
  text-align: center;
  letter-spacing: -0.5px;
}

.logo-sub {
  font-size: 13px;
  color: #555;
  text-align: center;
  margin-top: 4px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.token-wrap {
  width: 100%;
  max-width: 320px;
  animation: fadeUp 0.8s ease 0.2s both;
}

.token-label {
  font-size: 12px;
  color: #555;
  text-align: center;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

.token-input-wrap {
  position: relative;
  margin-bottom: 12px;
}

.token-input {
  width: 100%;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 14px 44px 14px 16px;
  font-size: 16px;
  color: #fff;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  letter-spacing: 3px;
  text-align: center;
  transition: border-color 0.2s;
  outline: none;
}

.token-input:focus { border-color: #c8ff00; }
.token-input.erro { border-color: #ef4444; animation: shake 0.3s ease; }
.token-input.ok { border-color: #22c55e; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.token-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: #555;
  cursor: pointer;
  font-size: 18px;
  padding: 4px;
}

.btn-entrar {
  width: 100%;
  background: #c8ff00;
  color: #111;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.2s;
}

.btn-entrar:hover { background: #d4ff33; transform: translateY(-1px); }
.btn-entrar:active { transform: translateY(0); }

.erro-msg {
  font-size: 12px;
  color: #ef4444;
  text-align: center;
  margin-top: 10px;
  min-height: 18px;
  transition: opacity 0.2s;
}

.rodape {
  position: fixed;
  bottom: 2rem;
  font-size: 11px;
  color: #333;
  text-align: center;
  letter-spacing: 0.5px;
  animation: fadeUp 0.8s ease 0.4s both;
}

.loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #111;
  z-index: 100;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
}
.loading-overlay.ativo { display: flex; }

.loading-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid #333;
  border-top-color: #c8ff00;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading-txt {
  font-size: 14px;
  color: #555;
  font-family: 'Syne', sans-serif;
}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="logo-wrap">
    <div class="logo-box">
      <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="14" width="32" height="18" rx="4" fill="#111"/>
        <rect x="10" y="10" width="24" height="8" rx="3" fill="#111"/>
        <circle cx="13" cy="32" r="3" fill="#111"/>
        <circle cx="31" cy="32" r="3" fill="#111"/>
        <rect x="8" y="20" width="10" height="6" rx="2" fill="#c8ff00" opacity="0.8"/>
        <rect x="26" y="20" width="10" height="6" rx="2" fill="#c8ff00" opacity="0.8"/>
      </svg>
    </div>
    <div class="logo-nome">BOX MKT</div>
    <div class="logo-sub">Estética Automotiva</div>
  </div>

  <div class="token-wrap">
    <div class="token-label">Digite o código de acesso</div>
    <div class="token-input-wrap">
      <input
        type="password"
        class="token-input"
        id="token-input"
        placeholder="••••••••"
        maxlength="20"
        onkeydown="if(event.key==='Enter') verificarToken()"
        autocomplete="off"
      >
      <button class="token-toggle" onclick="toggleVis()" id="toggle-btn">👁</button>
    </div>
    <button class="btn-entrar" onclick="verificarToken()">Entrar</button>
    <div class="erro-msg" id="erro-msg"></div>
  </div>
</div>

<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-txt">Carregando BOX MKT...</div>
</div>

<div class="rodape">BOX 0.0 — Sistema de Gestão & Marketing</div>

<script>
const TOKEN_VALIDO = 'BOX2903';
const TOKEN_KEY = 'boxmkt_token_ts';
const SETE_DIAS = 7 * 24 * 60 * 60 * 1000;
const APP_URL = 'boxmkt.html';

function jaAutenticado() {
  const ts = localStorage.getItem(TOKEN_KEY);
  return ts && (Date.now() - parseInt(ts)) < SETE_DIAS;
}

function verificarToken() {
  const val = document.getElementById('token-input').value.trim().toUpperCase();
  const inp = document.getElementById('token-input');
  const err = document.getElementById('erro-msg');

  if (val === TOKEN_VALIDO) {
    inp.classList.remove('erro');
    inp.classList.add('ok');
    err.textContent = '';
    localStorage.setItem(TOKEN_KEY, Date.now().toString());
    document.getElementById('loading').classList.add('ativo');
    setTimeout(() => { window.location.href = APP_URL; }, 600);
  } else {
    inp.classList.add('erro');
    err.textContent = 'Código incorreto. Tente novamente.';
    inp.value = '';
    setTimeout(() => inp.classList.remove('erro'), 400);
  }
}

function toggleVis() {
  const inp = document.getElementById('token-input');
  const btn = document.getElementById('toggle-btn');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}

if (jaAutenticado()) {
  document.getElementById('loading').classList.add('ativo');
  setTimeout(() => { window.location.href = APP_URL; }, 300);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
